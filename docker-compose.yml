services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    image: ghcr.io/cnitika/docker-cicd-practice:latest
    environment:
      DB_HOST: host.docker.internal
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: appdb
    ports:
      - "3000:3000"
volumes:
  pgdata: