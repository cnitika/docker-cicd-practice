services:
  filesync:
    image: alpine:3.20
    volumes:
      - ./cms_files:/data/source:ro
      - ./cms_replica:/data/replica
      - ./sync.sh:/sync.sh:ro
    command: >
      sh -c "apk add --no-cache rsync &&
      echo '* * * * * /bin/sh /sync.sh > /proc/1/fd/1 2>&1' > /etc/crontabs/root &&
      crond -f -l 8"
